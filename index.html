<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE MATRIX V.3.0 - Arlingツ Edition</title>
    <style>
        :root { 
            --neon: #00FF41; 
            --dark: #003B00; 
            --hud-bg: rgba(0, 20, 0, 0.95); 
            --warn: #ffcc00; 
        }
        
        body {
            margin: 0; padding: 0;
            background-color: black;
            color: var(--neon);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        #matrix-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; opacity: 0.6;
        }

        /* --- UI HEADER --- */
        .hud-panel {
            position: relative; z-index: 10;
            width: 90vw; max-width: 560px;
            background: var(--hud-bg);
            border: 1px solid var(--neon);
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 12px;
            box-shadow: 0 -2px 10px rgba(0, 255, 65, 0.2);
        }

        .stat-item {
            display: flex; justify-content: space-between;
            border-bottom: 1px dashed #005500;
            padding-bottom: 2px;
        }
        .stat-val { font-weight: bold; text-shadow: 0 0 5px var(--neon); }

        /* --- GAME CANVAS --- */
        canvas#gameCanvas {
            position: relative; z-index: 10;
            background-color: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--neon);
            display: block;
            max-width: 90vw; max-height: 50vh;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.1);
        }

        /* --- CONTROLS & SETTINGS --- */
        .panel { 
            margin-top: 15px; z-index: 10; 
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            width: 90vw; max-width: 560px;
        }
        
        .settings-row {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;
            background: rgba(0, 59, 0, 0.4);
            padding: 10px; border-radius: 15px;
            border: 1px solid var(--neon);
            width: 100%; box-sizing: border-box;
        }

        /* Custom Slider */
        .slider-container { display: flex; align-items: center; gap: 5px; font-size: 10px; }
        input[type=range] { 
            width: 80px; height: 5px; -webkit-appearance: none; background: #003300; outline: none; border-radius: 5px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 15px; height: 15px; background: var(--neon); cursor: pointer; border-radius: 50%;
        }

        /* Custom Select */
        select.music-select {
            background: black; color: var(--neon); border: 1px solid var(--neon);
            font-family: 'Courier New', monospace; font-size: 10px; padding: 3px;
            border-radius: 4px; cursor: pointer;
        }

        .btn-ui {
            background: transparent; border: 1px solid var(--neon);
            color: var(--neon); padding: 5px 10px; font-size: 11px;
            cursor: pointer; border-radius: 5px; font-weight: bold;
            transition: 0.2s;
        }
        .btn-ui:hover { background: rgba(0, 255, 65, 0.2); }
        #pauseBtn.paused { background: var(--warn); color: black; border-color: var(--warn); }

        /* --- JOYPAD --- */
        .joypad {
            z-index: 10; margin-top: 15px;
            display: grid; grid-template-columns: repeat(3, 65px); gap: 8px;
        }

        .btn-ctrl {
            width: 65px; height: 65px;
            background: rgba(0, 20, 0, 0.6);
            color: var(--neon); border: 2px solid var(--neon);
            border-radius: 50%; font-weight: bold; font-size: 20px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .btn-ctrl:active { background: var(--neon); color: black; transform: scale(0.95); }

        /* --- OVERLAY & AUTHOR --- */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .blink { animation: blinker 1s infinite; margin-bottom: 20px; color: var(--neon); font-size: 1.5em; text-align: center; }
        @keyframes blinker { 50% { opacity: 0.3; } }
        
        .btn-start {
            padding: 15px 40px; border: 2px solid var(--neon); 
            background: var(--dark); color: white; font-weight: bold;
            cursor: pointer; box-shadow: 0 0 15px var(--neon);
            font-family: inherit; font-size: 16px;
        }

        .author-tag {
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.8;
            border-top: 1px solid var(--neon);
            padding-top: 5px;
            letter-spacing: 2px;
        }

        .hud-author {
            position: absolute; bottom: -20px; right: 0;
            font-size: 10px; opacity: 0.5;
        }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <div id="overlay">
        <div class="blink">SYSTEM_READY<br>V.3.0</div>
        <button class="btn-start" onclick="startGame()">INITIATE</button>
        <div class="author-tag">AUTHOR : Arlingツ</div>
    </div>

    <div class="hud-panel">
        <div class="stat-item"><span class="stat-label">DATA:</span> <span class="stat-val" id="score">0</span></div>
        <div class="stat-item"><span class="stat-label">BEST:</span> <span class="stat-val" id="highScore">0</span></div>
        <div class="stat-item"><span class="stat-label">STATUS:</span> <span class="stat-val" id="statusLabel">READY</span></div>
        <div class="stat-item"><span class="stat-label">TIME:</span> <span class="stat-val" id="timeEl">00:00</span></div>
        <div class="hud-author">By Arlingツ</div>
    </div>

    <canvas id="gameCanvas" width="560" height="560"></canvas>

    <div class="panel">
        <div class="settings-row">
            <select id="musicSelect" class="music-select" onchange="changeTrack(this.value)">
                <option value="0">♫ TRACK A: DEEP</option>
                <option value="1">♫ TRACK B: ACTION</option>
                <option value="2">♫ TRACK C: RETRO</option>
            </select>
            <button class="btn-ui" id="muteBtn" onclick="toggleMusic()">🔊 ON</button>
            <button class="btn-ui" id="pauseBtn" onclick="togglePause()">⏸ PAUSE</button>
        </div>
        
        <div class="settings-row">
            <div class="slider-container">
                <span>SLOW</span>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span>FAST</span>
            </div>
        </div>
    </div>

    <div class="joypad">
        <div></div><button class="btn-ctrl" onclick="control('up')">▲</button><div></div>
        <button class="btn-ctrl" onclick="control('left')">◀</button>
        <button class="btn-ctrl" onclick="control('down')">▼</button>
        <button class="btn-ctrl" onclick="control('right')">▶</button>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const authorName = "Arlingツ";
        console.log(`Code Reformatted by ${authorName}`);

        // --- 2. AUDIO SYSTEM (VARIANTS ADDED) ---
        // Menggunakan URL placeholder loop game yang stabil
        const tracks = [
            "https://codeskulptor-demos.commondatastorage.googleapis.com/descent/background%20music.mp3", // Deep
            "https://codeskulptor-demos.commondatastorage.googleapis.com/GalaxyInvaders/theme_01.mp3",   // Action
            "https://codeskulptor-demos.commondatastorage.googleapis.com/pang/paza-moduless.mp3"         // Retro
        ];
        
        const bgm = new Audio(tracks[0]);
        bgm.loop = true;
        bgm.volume = 0.4;
        let isMuted = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function changeTrack(index) {
            const wasPlaying = !bgm.paused;
            bgm.src = tracks[index];
            bgm.loop = true;
            if(wasPlaying && !isMuted) bgm.play();
        }

        function toggleMusic() {
            isMuted = !isMuted;
            bgm.muted = isMuted;
            const btn = document.getElementById("muteBtn");
            btn.innerText = isMuted ? "🔇 OFF" : "🔊 ON";
            btn.style.color = isMuted ? "red" : "#00FF41";
            
            // Resume context if needed
            if(!isMuted && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSfx(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            if(isMuted) return;
            
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            
            if(type === 'click') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if(type === 'eat') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        // --- 3. MATRIX BACKGROUND ---
        const matrixCanvas = document.getElementById("matrix-bg");
        const matrixCtx = matrixCanvas.getContext("2d");
        let matrixDrops = [];
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*アイウエオカキクケコArlingツ"; // Easter egg in matrix

        function resizeMatrix() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            matrixDrops = Array(Math.ceil(matrixCanvas.width / 20)).fill(1);
        }
        function drawMatrix() {
            matrixCtx.fillStyle = "rgba(0, 0, 0, 0.05)";
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            matrixCtx.fillStyle = "#00FF41";
            matrixCtx.font = "16px monospace";
            for (let i = 0; i < matrixDrops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                matrixCtx.fillText(text, i * 20, matrixDrops[i] * 20);
                if (matrixDrops[i] * 20 > matrixCanvas.height && Math.random() > 0.975) matrixDrops[i] = 0;
                matrixDrops[i]++;
            }
        }
        window.addEventListener('resize', resizeMatrix);
        resizeMatrix();
        setInterval(drawMatrix, 50);

        // --- 4. GAME ENGINE REFORM ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const box = 20;
        
        let score = 0;
        let highScore = localStorage.getItem('snakeMatrixV3_Arling') || 0;
        let startTime, timerInterval, gameLoop;
        let isPaused = false;
        let isGameOver = false;
        let d = "right";
        let snake = [];
        let food = {};
        let totalElapsedSeconds = 0;

        document.getElementById('highScore').innerText = highScore;

        // SPEED SLIDER LOGIC REFORM
        const speedSlider = document.getElementById('speedSlider');
        
        function getSpeedDelay() {
            // Logic: Slider 1 (Slow) -> 250ms delay
            // Logic: Slider 10 (Fast) -> 50ms delay
            // Formula: Base 270 - (Value * 22)
            const val = parseInt(speedSlider.value);
            return 272 - (val * 22); 
        }

        // Event Listener untuk Slider agar responsif realtime
        speedSlider.addEventListener('input', function() {
            if (!isPaused && !isGameOver && document.getElementById('overlay').style.display === 'none') {
                clearInterval(gameLoop);
                gameLoop = setInterval(draw, getSpeedDelay());
            }
        });

        function togglePause() {
            if(document.getElementById('overlay').style.display === 'none' && !isGameOver) {
                isPaused = !isPaused;
                const pBtn = document.getElementById('pauseBtn');
                const statusLbl = document.getElementById('statusLabel');
                
                if(isPaused) {
                    clearInterval(gameLoop);
                    pBtn.innerText = "▶ RESUME";
                    pBtn.classList.add('paused');
                    statusLbl.innerText = "PAUSED";
                    statusLbl.style.color = "var(--warn)";
                    bgm.pause();
                } else {
                    gameLoop = setInterval(draw, getSpeedDelay());
                    pBtn.innerText = "⏸ PAUSE";
                    pBtn.classList.remove('paused');
                    statusLbl.innerText = "RUNNING";
                    statusLbl.style.color = "var(--neon)";
                    if(!isMuted) bgm.play();
                    startTime = Date.now() - (totalElapsedSeconds * 1000);
                }
                playSfx('click');
            }
        }

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('statusLabel').innerText = "RUNNING";
            
            if(!isMuted) bgm.play().catch(e => console.log("Audio needs interaction"));
            
            score = 0;
            totalElapsedSeconds = 0;
            isGameOver = false;
            document.getElementById('score').innerText = "0";
            
            // Reset Snake Position
            snake = [{x: 10*box, y: 10*box}];
            d = "right";
            isPaused = false;
            
            // Spawn Food
            spawnFood();

            // Timer
            startTime = Date.now();
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            
            // Game Loop with new Speed Logic
            clearInterval(gameLoop);
            gameLoop = setInterval(draw, getSpeedDelay());
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width/box)) * box,
                y: Math.floor(Math.random() * (canvas.height/box)) * box
            };
            // Prevent food spawning on snake body
            for(let part of snake) {
                if(part.x === food.x && part.y === food.y) spawnFood();
            }
        }

        function updateTimer() {
            if(!isPaused && !isGameOver) {
                totalElapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                const m = Math.floor(totalElapsedSeconds / 60).toString().padStart(2, '0');
                const s = (totalElapsedSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timeEl').innerText = `${m}:${s}`;
            }
        }

        function control(dir) {
            if(isPaused || isGameOver) return;
            playSfx('click');
            if(dir=='up' && d!='down') d='up';
            if(dir=='down' && d!='up') d='down';
            if(dir=='left' && d!='right') d='left';
            if(dir=='right' && d!='left') d='right';
        }

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if(key === 'w' || e.key === 'ArrowUp') control('up');
            if(key === 's' || e.key === 'ArrowDown') control('down');
            if(key === 'a' || e.key === 'ArrowLeft') control('left');
            if(key === 'd' || e.key === 'ArrowRight') control('right');
            if(key === 'p') togglePause();
            if(key === ' ' && isGameOver) startGame(); // Space restart
        });

        function draw() {
            // Clear Screen
            ctx.fillStyle = "black";
            ctx.fillRect(0,0,canvas.width,canvas.height);

            // Draw Food
            ctx.shadowBlur = 15; ctx.shadowColor = "#00FF41";
            ctx.fillStyle = "#00FF41";
            ctx.beginPath(); ctx.arc(food.x + box/2, food.y + box/2, box/2 - 2, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Snake
            for(let i=0; i<snake.length; i++){
                ctx.fillStyle = (i == 0) ? "#00FF41" : "#005500";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                
                ctx.strokeStyle = "black";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            // Logic Movement
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(d == "left") snakeX -= box;
            if(d == "up") snakeY -= box;
            if(d == "right") snakeX += box;
            if(d == "down") snakeY += box;

            // Collision with Wall (Wrap around option could be added, but keeping fatal walls)
            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(snakeX, snakeY, snake)){
                gameOver();
                return;
            }

            // Eat Food
            if(snakeX == food.x && snakeY == food.y){
                score++;
                playSfx('eat');
                document.getElementById('score').innerText = score;
                if(score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeMatrixV3_Arling', highScore);
                    document.getElementById('highScore').innerText = highScore;
                }
                spawnFood();
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };
            snake.unshift(newHead);
        }

        function collision(x, y, array){
            for(let i = 0; i < array.length; i++){
                if(x == array[i].x && y == array[i].y){
                    return true;
                }
            }
            return false;
        }

        function gameOver() {
            clearInterval(gameLoop);
            clearInterval(timerInterval);
            isGameOver = true;
            document.body.style.backgroundColor = "#220000";
            
            setTimeout(() => {
                alert(`SYSTEM FAILURE // AUTHOR: ${authorName}\nSCORE: ${score}\nTIME: ${document.getElementById('timeEl').innerText}`);
                location.reload();
            }, 100);
        }
    </script>
</body>
</html>
